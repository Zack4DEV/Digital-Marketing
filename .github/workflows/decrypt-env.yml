name: Decrypt .env File

on:
  push:
    branches:
      - main

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography

    - name: Decrypt .env file
      env:  ${{ secrets.MENDABLE_API_KEY }}
      run: |
        python -c "
        from cryptography.fernet import Fernet; 
        import base64;
        import hashlib;
        api_key = "${{ secrets.MENDABLE_API_KEY }}";
        key_bytes = hashlib.sha256(api_key.encode('utf-8')).digest();
        url_safe_key = base64.urlsafe_b64encode(key_bytes[:32]);
        fernet = Fernet(url_safe_key);
        with open('.env.development.enc', 'rb') as file: 
            encrypted = file.read(); 
        decrypted = fernet.decrypt(encrypted); 
        with open('.env.development', 'wb') as decrypted_file: 
            decrypted_file.write(decrypted);
        "

    - name: Use decrypted .env file
      run: |
        cat .env.development
