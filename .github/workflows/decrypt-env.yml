name: Decrypt .env File

on:
  push:
    branches:
      - main

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography

    - name: Decrypt .env file
      env:
        MENDABLE_API_KEY: ${{ secrets.MENDABLE_API_KEY }}
      run: |
        python -c "from cryptography.fernet import Fernet; fernet = Fernet(b'${{ secrets.MENDABLE_API_KEY }}'); with open('.env.development.enc', 'rb') as file: encrypted = file.read(); decrypted = fernet.decrypt(encrypted); with open('.env.development', 'wb') as decrypted_file: decrypted_file.write(decrypted)"

    - name: Use decrypted .env file
      run: |
        # Your script or command that uses the decrypted .env file
        cat .env.development